# @package _global_
# Model architecture and training schedule; task owns data, timing and coordinates.
defaults:
- /common/workspace
- _self_
- /task: lift/image_abs
name: train_image
_target_: liespline_dp.workspace.baseline.train_image_workspace.TrainBaselineImageWorkspace
shape_meta: ${task.shape_meta}
exp_name: default
policy:
  _target_: liespline_dp.policy.baseline.diffusion_image_policy.DiffusionImagePolicy
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    variance_type: fixed_small
  horizon: ${task.horizon}
  n_action_steps: ${eval:'${task.n_action_steps}+${task.n_latency_steps}'}
  n_obs_steps: ${task.n_obs_steps}
  num_inference_steps: 100
  crop_shape:
  - 76
  - 76
  obs_encoder_group_norm: true
  eval_fixed_crop: true
  n_layer: 8
  n_cond_layers: 0
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: true
  time_as_cond: true
  obs_as_cond: ${task.obs_as_cond}
dataloader:
  batch_size: 64
  num_workers: 8
val_dataloader:
  batch_size: 64
  num_workers: 8
optimizer:
  transformer_weight_decay: 0.001
  obs_encoder_weight_decay: 1.0e-06
  learning_rate: 0.0001
training:
  resume: true
  lr_warmup_steps: 1000
  num_epochs: 3050
  rollout_every: 50
  checkpoint_every: 50
logging:
  project: liespline-dp
  resume: true
  tags:
  - baseline_image
  - ${task_name}
  - ${exp_name}
checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
