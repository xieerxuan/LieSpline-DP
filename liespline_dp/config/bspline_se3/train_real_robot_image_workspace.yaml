# @package _global_
# Model architecture and training schedule; task owns data, timing and coordinates.
defaults:
- /common/workspace
- _self_
- /task: real_robot/bspline_se3_image
name: train_real_robot_bspline_se3_image
_target_: liespline_dp.workspace.bspline_se3.train_real_robot_workspace.TrainLieSplineRealRobotWorkspace
action_dim: ${task.action_dim}
trajectory_dim: ${task.trajectory_dim}
exp_name: real_robot
horizon: ${eval:'${task.bspline.prefix_cp_steps} + ${task.bspline.pred_horizon}'}
diffusion_prefix_cp_steps: ${task.bspline.prefix_cp_steps}
pose_diffusion_horizon: ${eval:'${task.bspline.pred_horizon} + ${diffusion_prefix_cp_steps}'}
diffusion_horizon: ${pose_diffusion_horizon}
boundary_condition_steps: ${eval:'int(${diffusion_prefix_cp_steps} < ${task.bspline.prefix_cp_steps})'}
n_obs_steps: ${task.bspline.n_obs_steps}
n_action_steps: ${task.bspline.n_action_steps}
n_infer_steps: ${task.n_infer_steps}
n_latency_steps: ${task.n_latency_steps}
past_action_visible: ${task.past_action_visible}
policy:
  _target_: liespline_dp.policy.bspline_se3.bspline_se3_image_policy.BsplineSE3ImagePolicy
  target_attn_mode: block_causal
  shape_meta: ${task.shape_meta}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    set_alpha_to_one: true
    steps_offset: 0
  action_pose_adapter: ${task.action_pose_adapter}
  horizon: ${horizon}
  trajectory_dim: ${trajectory_dim}
  gripper_dim: ${task.se3.gripper_dim}
  num_robots: ${task.se3.num_robots}
  initial_gripper: ${task.se3.initial_gripper}
  binarize_gripper: ${task.se3.binarize_gripper}
  gripper_representation: ${task.se3.gripper_representation}
  gripper_spline_degree: ${task.se3.gripper_spline_degree}
  gripper_loss_weight: 0.1111111111111111
  prefix_cp_steps: ${task.bspline.prefix_cp_steps}
  diffusion_prefix_cp_steps: ${diffusion_prefix_cp_steps}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 8
  degree: ${task.bspline.degree}
  exec_horizon: ${task.bspline.exec_horizon}
  prefix_corruption_probability: 0.0
  prefix_corruption_scale_min: 0.0
  prefix_corruption_scale_max: 1.0
  prefix_corruption_translation_std: 0.002
  prefix_corruption_rotation_std_deg: 1.0
  crop_shape:
  - 216
  - 288
  obs_encoder_group_norm: true
  eval_fixed_crop: true
  n_layer: 8
  n_cond_layers: 0
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  time_as_cond: true
  obs_as_cond: true
dataloader:
  batch_size: 64
  num_workers: 8
val_dataloader:
  batch_size: 64
  num_workers: 4
optimizer:
  transformer_weight_decay: 0.001
  obs_encoder_weight_decay: 1.0e-06
  learning_rate: 0.0001
training:
  resume: false
  lr_warmup_steps: 500
  num_epochs: 3000
  rollout_every: null
  checkpoint_every: 25
logging:
  project: liespline-dp
  resume: false
  tags:
  - real_bspline_se3
  - ${task_name}
  - ${exp_name}
checkpoint:
  ema_checkpoint_every: 50
  topk:
    monitor_key: val_loss
    mode: min
    format_str: epoch={epoch:04d}-val_loss={val_loss:.4f}.ckpt
