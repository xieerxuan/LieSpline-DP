defaults:
- /task/lift/_baseline@_here_
- _self_
name: lift_image
shape_meta:
  obs:
    agentview_image:
      shape:
      - 3
      - 84
      - 84
      type: rgb
    robot0_eye_in_hand_image:
      shape:
      - 3
      - 84
      - 84
      type: rgb
    robot0_eef_pos:
      shape:
      - 3
    robot0_eef_quat:
      shape:
      - 4
    robot0_gripper_qpos:
      shape:
      - 2
  action:
    shape:
    - 10
dataset_path: data/robomimic/datasets/${.task_name}/${.dataset_type}/image_abs.hdf5
env_runner:
  _target_: liespline_dp.env_runner.robomimic_image_runner.RobomimicImageRunner
  dataset_path: ${..dataset_path}
  shape_meta: ${..shape_meta}
  n_test_vis: 4
  render_obs_key: agentview_image
dataset:
  _target_: liespline_dp.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
  shape_meta: ${..shape_meta}
  dataset_path: ${..dataset_path}
  n_obs_steps: ${..dataset_obs_steps}
  use_cache: true
