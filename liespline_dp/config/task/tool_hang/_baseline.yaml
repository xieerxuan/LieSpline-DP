# Shared task parameters; modality files only add disjoint fields.
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_infer_steps: ${.n_action_steps}
n_latency_steps: ${eval:'${.n_action_steps}-${.n_infer_steps}'}
dataset_obs_steps: ${.n_obs_steps}
past_action_visible: false
keypoint_visible_rate: 1.0
obs_as_cond: true
pred_action_steps_only: false
task_name: tool_hang
dataset_type: ph
abs_action: true
env_runner:
  n_train: 6
  n_train_vis: 2
  train_start_idx: 0
  n_test: 50
  n_test_vis: 4
  test_start_seed: 100000
  max_steps: 700
  n_obs_steps: ${..n_obs_steps}
  n_action_steps: ${..n_action_steps}
  n_infer_steps: ${..n_infer_steps}
  fps: 10
  crf: 22
  past_action: ${..past_action_visible}
  abs_action: true
  n_envs: 28
dataset:
  horizon: ${..horizon}
  pad_before: ${eval:'${..n_obs_steps}-1'}
  pad_after: ${eval:'${..n_action_steps}-1'}
  abs_action: true
  rotation_rep: rotation_6d
  seed: 42
  val_ratio: 0.02
